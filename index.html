<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh Du lịch Việt Nam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Vẻ Đẹp Du Lịch Việt Nam</h1>

    <!-- Khung hiển thị lớn chính -->
    <div id="image">
        Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.
    </div>

    <!-- Danh sách ảnh xem trước -->
    <div class="preview-container">
        <img class="preview" 
             alt="Vịnh Hạ Long - Toàn cảnh núi đá vôi hùng vĩ" 
             src="1.jpg" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Vịnh Hạ Long - Du thuyền trên làn nước xanh ngọc" 
             src="2.jpg" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Phố cổ Hội An - Đèn lồng rực rỡ sắc màu" 
             src="3.jpg" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Mù Cang Chải - Ruộng bậc thang đồi núi" 
             src="4.jpg" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Tây Bắc - Thung lũng ruộng bậc thang vàng óng" 
             src="5.jpg" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Tràng An Ninh Bình - Non nước hữu tình" 
             src="6.jpg" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">
    </div>

    <script src="script.js"></script>
</body>
</html>
